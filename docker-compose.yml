# =============================================================================
# MeshMonitor Pi — Docker Compose Stack (SD Card Optimized)
# =============================================================================
#
# This file defines the core MeshMonitor service only.
# BLE and serial bridge services are defined in docker-compose.generated.yml,
# which is generated automatically by launch.sh from your .env configuration.
# Do not edit docker-compose.generated.yml — it is overwritten on every launch.
#
# SD Card Write Protection (5 layers):
#   1. Docker local log driver — capped at 100KB x 2 files per container
#   2. daemon.json             — system-wide Docker log cap (installed by setup.sh)
#   3. ACCESS_LOG_ENABLED=false — no HTTP access logs written
#   4. tmpfs /data/logs        — audit log goes to RAM, never hits SD
#   5. OS hardening            — noatime, volatile journal, tmpfs /var/log
#
# Only necessary SD writes:
#   - SQLite database (/data/meshmonitor.db) — required for persistence
#   - Docker image layers                    — pulled during upgrades only
#
# Usage:
#   ./setup.sh                     # first-time setup and configuration wizard
#   ./setup.sh                     # re-run to add nodes or change settings
#   ./scan-ble.sh                  # discover nearby Bluetooth nodes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MeshMonitor — web dashboard
  #
  # MESHTASTIC_NODE_IP bootstraps the first source on initial install only.
  # After first boot, add and manage sources via Dashboard → Sources.
  # Changing this env var after first boot has no effect on existing sources.
  #
  # For BLE or serial nodes: leave MESHTASTIC_NODE_IP unset — MeshMonitor
  # starts cleanly with no bootstrap source. Add bridge containers as sources
  # via Dashboard → Sources → Add Source → TCP after first boot.
  # ---------------------------------------------------------------------------
  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest
    container_name: meshmonitor
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:3001"
    networks:
      - meshtastic_net
    volumes:
      - meshmonitor-data:/data
    tmpfs:
      - /data/logs:size=10M
      - /tmp:size=50M
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Phoenix}

      # TCP node bootstrap — seeds first source on first boot only.
      # Omit or leave blank for BLE/serial-only deployments.
      - MESHTASTIC_NODE_IP=${NODE_1_IP:-}
      - MESHTASTIC_NODE_PORT=${NODE_1_PORT:-4403}

      # Access control
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - SESSION_SECRET=${SESSION_SECRET}

      # Write reduction
      - ACCESS_LOG_ENABLED=false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "100k"
        max-file: "2"

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  meshmonitor-data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  meshtastic_net:
    driver: bridge
